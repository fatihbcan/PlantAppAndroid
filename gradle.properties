# JVM args for the Gradle daemon. 4 GB is enough for a fresh starter project.
# If you grow past ~50 modules, bump to 6g or 8g and consider adding -XX:+UseG1GC tuning.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Run independent module builds in parallel.
org.gradle.parallel=true

# Reuse outputs across builds when inputs haven't changed.
org.gradle.caching=true

# Configuration cache. Speeds up incremental builds significantly. Disable temporarily if you
# hit a "Could not store the configuration cache" error from a plugin that doesn't support it.
org.gradle.configuration-cache=true

# Only configure the projects that the requested tasks need. Big speedup for multi-module builds.
org.gradle.configureondemand=true

# Modern Android settings — leave these on.
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# KSP — incremental processing for KSP-using modules (Hilt, Room).
ksp.incremental=true
